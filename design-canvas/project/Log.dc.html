<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scraping log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: Roboto, system-ui, sans-serif; display: flex; flex-direction: column; position: relative">

<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px; background: {{t.bar}}">
<a href="Main.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.text}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
</a>
<h1 style="margin: 0; flex-grow: 1; font-size: 20px; font-weight: 500; color: {{t.text}}">Log</h1>
<button aria-label="Refresh" style="width: 48px; height: 48px; border: 0; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 3v6h-6"></path></svg>
</button>
<button aria-label="Clear the log" style="width: 48px; height: 48px; border: 0; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
</button>
</header>

<div style="flex-shrink: 0; background: {{t.bar}}; border-bottom: 1px solid {{t.border}}; padding: 4px 16px 12px; display: flex; gap: 8px; align-items: center">
<div role="group" aria-label="Show" style="display: flex; background: {{t.bg}}; border-radius: 100px; padding: 3px">
<button aria-pressed="{{allPressed}}" onClick="{{showAll}}" style="height: 32px; border: 0; border-radius: 100px; background: {{allBg}}; color: {{allText}}; font: 500 13px Roboto, sans-serif; padding: 0 14px">All</button>
<button aria-pressed="{{probPressed}}" onClick="{{showProblems}}" style="height: 32px; border: 0; border-radius: 100px; background: {{probBg}}; color: {{probText}}; font: 500 13px Roboto, sans-serif; padding: 0 14px">Problems only</button>
</div>
<span style="flex-grow: 1"></span>
<button onClick="{{copy}}" style="height: 36px; border: 0; border-radius: 100px; background: {{t.primary}}; color: {{t.onPrimary}}; font: 500 14px Roboto, sans-serif; padding: 0 16px; display: flex; align-items: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
Copy</button>
</div>

<main style="flex-grow: 1; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{runs}}" as="r" hint-placeholder-count="3">
<section style="background: {{t.surface}}; border: 1px solid {{t.border}}; border-radius: 14px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid {{t.border}}">
<span style="width: 8px; height: 8px; border-radius: 4px; background: {{r.dot}}"></span>
<span style="font-size: 14px; font-weight: 500; flex-grow: 1">{{r.title}}</span>
<span style="font-size: 12px; color: {{t.muted}}">{{r.meta}}</span>
</div>
<div style="padding: 6px 0">
<sc-for list="{{r.lines}}" as="l" hint-placeholder-count="5">
<div style="display: flex; gap: 8px; padding: 3px 12px; font-family: 'Roboto Mono', monospace; font-size: 11.5px; line-height: 17px">
<span style="color: {{t.muted}}; flex-shrink: 0">{{l.time}}</span>
<span style="flex-shrink: 0; width: 14px; text-align: center; font-weight: 500; border-radius: 4px; background: {{l.levelBg}}; color: {{l.levelText}}">{{l.level}}</span>
<span style="color: {{l.color}}; min-width: 0; overflow-wrap: anywhere">{{l.text}}</span>
</div>
</sc-for>
</div>
</section>
</sc-for>
</main>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 24px; background: {{t.toastBg}}; color: {{t.toastText}}; border-radius: 12px; padding: 14px 16px; font-size: 14px">Log copied. Paste it anywhere.</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  theme(dark) {
    if (dark) {
      return { bg: '#0F1318', bar: '#151A21', surface: '#1A2029', border: '#2A323D', text: '#E6EAF0', muted: '#9AA5B4', primary: '#6FA3F8', onPrimary: '#0B1A33', soft: '#1F2B3E', softText: '#9CC0FB', good: '#5AD394', goodSoft: '#17322A', warn: '#F0B65A', warnSoft: '#33280F', bad: '#F49A92', badSoft: '#3A1E1D', toastBg: '#E6EAF0', toastText: '#1B2430' };
    }
    return { bg: '#F2F4F8', bar: '#FFFFFF', surface: '#FFFFFF', border: '#E1E6EE', text: '#1B2430', muted: '#5F6B7A', primary: '#1F6FEB', onPrimary: '#FFFFFF', soft: '#E8F0FE', softText: '#1A5BC4', good: '#137A4A', goodSoft: '#E3F5EC', warn: '#8A5200', warnSoft: '#FDF1DE', bad: '#B93A31', badSoft: '#FBE7E5', toastBg: '#1B2430', toastText: '#FFFFFF' };
  }
  componentWillUnmount() {
    clearTimeout(this.toastTimer);
  }
  renderVals() {
    const t = this.theme(this.props.dark ?? false);
    const s = this.state || {};
    const problems = !!s.problems;
    const style = {
      I: { levelBg: 'transparent', levelText: t.muted, color: t.text },
      W: { levelBg: t.warnSoft, levelText: t.warn, color: t.warn },
      E: { levelBg: t.badSoft, levelText: t.bad, color: t.bad }
    };
    const runs = [
      { title: 'Run 05:34', meta: '4 sources · 3 min 26 s', dot: t.warn, lines: [
        ['05:38:11', 'I', 'linkedin_jobs: parsed 2, matched 0, new 0 | rejected {title=2}'],
        ['05:37:02', 'I', 'tanqeeb: parsed 57, matched 1, new 0 | rejected {title=45, tech=8, seniority-excluded=3}'],
        ['05:37:02', 'I', '· seen tanqeeb: PHP Backend Developer @ IX Solutions'],
        ['05:36:08', 'W', 'Tanqeeb returned a page with no job cards for "Laravel Developer"'],
        ['05:36:06', 'I', 'workable: parsed 6, matched 1, new 0 | rejected {seniority-excluded=3, title=2}'],
        ['05:35:44', 'I', 'wuzzuf: parsed 0, matched 0, new 0'],
        ['05:34:45', 'I', 'Due this run: wuzzuf, workable, tanqeeb, linkedin_jobs']
      ] },
      { title: 'Run 04:32', meta: '4 sources · 4 min 12 s', dot: t.warn, lines: [
        ['04:36:32', 'I', 'linkedin_jobs: parsed 1, matched 0, new 0 | rejected {title=1}'],
        ['04:34:39', 'W', 'LinkedIn throttled (HTTP 429), next wait 5000 ms'],
        ['04:34:29', 'I', 'tanqeeb: parsed 60, matched 1, new 0'],
        ['04:33:34', 'I', 'workable: parsed 6, matched 1, new 0']
      ] },
      { title: 'Run 04:09', meta: '4 sources · 7 min 1 s', dot: t.bad, lines: [
        ['04:16:10', 'I', 'linkedin_jobs: parsed 3, matched 0, new 0 | rejected {tech=1, title=2}'],
        ['04:15:02', 'E', 'tanqeeb: ERROR: InterruptedIOException: timeout'],
        ['04:12:48', 'E', 'workable: STOPPED after 3 attempts: timeout'],
        ['04:11:04', 'E', 'wuzzuf: STOPPED after 3 attempts: timeout']
      ] }
    ];
    const on = (yes) => ({ bg: yes ? t.surface : 'transparent', text: yes ? t.text : t.muted, pressed: yes ? 'true' : 'false' });
    const a = on(!problems);
    const p = on(problems);
    return {
      t,
      runs: runs
        .map((r) => ({ ...r, lines: r.lines.filter((l) => !problems || l[1] !== 'I').map(([time, level, text]) => ({ time, level, text, ...style[level] })) }))
        .filter((r) => r.lines.length > 0),
      showAll: () => this.setState({ problems: false }),
      showProblems: () => this.setState({ problems: true }),
      allBg: a.bg, allText: a.text, allPressed: a.pressed,
      probBg: p.bg, probText: p.text, probPressed: p.pressed,
      hasToast: !!s.toast,
      copy: () => {
        clearTimeout(this.toastTimer);
        this.setState({ toast: true });
        this.toastTimer = setTimeout(() => this.setState({ toast: false }), 2200);
      }
    };
  }
}
</script>
</body>
</html>
